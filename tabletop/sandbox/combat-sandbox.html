<style>
/* Layout: an ops table. Hex map on the left, unit sheet and phase controls on the right, dice log under the map. */
:root {
  --bg: #e7eae3;
  --panel: #f5f6f1;
  --raised: #ffffff;
  --ink: #1b221e;
  --muted: #5a645d;
  --line: #c3cabf;
  --map: #dde2d6;
  --hex-line: #b4bcae;
  --blue: #285a9c;
  --blue-soft: #d6e1f0;
  --red: #b1372a;
  --red-soft: #f2d9d4;
  --accent: #b97c0c;
  --accent-soft: rgba(201, 138, 18, 0.30);
  --range-soft: rgba(44, 122, 71, 0.22);
  --good: #2c7a47;
  --warn: #b97c0c;
  --bad: #b1372a;
  --label: #46504a;
  --cover-1: #cdd8be;
  --cover-2: #a6ba90;
  --cover-edge: #4a453b;
  --obs-low: #aaa498;
  --obs-tall: #5e584c;
  --wreck: #c4977a;
  --terrain-mark: rgba(27, 34, 30, 0.40);

  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --panel: #1b211d; --raised: #222a25; --ink: #e2e8e0; --muted: #96a399;
    --line: #313b34; --map: #18201b; --hex-line: #2b352e;
    --blue: #79a3e3; --blue-soft: #1f2d42; --red: #e27a68; --red-soft: #3d2420;
    --accent: #e6ac3c; --accent-soft: rgba(230, 172, 60, 0.28); --range-soft: rgba(95, 191, 130, 0.20);
    --good: #5fbf82; --warn: #e6ac3c; --bad: #e27a68;
    --label: #b4bfb6; --cover-1: #213328; --cover-2: #335c3d; --cover-edge: #c2baa4;

}
:root[data-theme="dark"] {
  --bg: #131815; --panel: #1b211d; --raised: #222a25; --ink: #e2e8e0; --muted: #96a399;
  --line: #313b34; --map: #18201b; --hex-line: #2b352e;
  --blue: #79a3e3; --blue-soft: #1f2d42; --red: #e27a68; --red-soft: #3d2420;
  --accent: #e6ac3c; --accent-soft: rgba(230, 172, 60, 0.28); --range-soft: rgba(95, 191, 130, 0.20);
  --good: #5fbf82; --warn: #e6ac3c; --bad: #e27a68;
  --label: #b4bfb6; --cover-1: #213328; --cover-2: #335c3d; --cover-edge: #c2baa4;
  --obs-low: #4e4b44; --obs-tall: #8f8979; --wreck: #66442f;
  --terrain-mark: rgba(226, 232, 224, 0.30); --move-tint: rgba(230, 172, 60, 0.13);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
select { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.label { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--label); }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 26px; font-weight: 700; line-height: 1; text-transform: uppercase; }
.brand span { color: var(--muted); font-size: 12px; }
.phases { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.phases div { padding: 4px 10px; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: var(--muted); }
.phases div.cur { background: var(--ink); color: var(--bg); }
.phases .round { color: var(--ink); border-right: 1px solid var(--line); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }

.init { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 4px; background: var(--panel); font-size: 12px; cursor: pointer; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip.done { opacity: 0.55; }
.chip.gone { text-decoration: line-through; opacity: 0.4; }
.dot.b { background: var(--blue); } .dot.r { background: var(--red); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.board { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.mapwrap { overflow-x: auto; background: var(--map); border: 1px solid var(--line); border-radius: 4px; }
/* renderMap crops the view to the pieces in play and sets the height so the whole map fits one screen. */
#map { display: block; width: 100%; min-width: 640px; height: auto; user-select: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--label); align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.legend svg { width: 16px; height: 16px; flex: none; overflow: visible; }
.legend b { font-family: var(--font-display); color: var(--ink); }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; white-space: nowrap; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--muted); }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.pane { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sheet-head h2 { font-size: 24px; }
.sheet-head .sub { color: var(--muted); font-size: 12px; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.meter { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.meter b { display: block; font-family: var(--font-mono); font-size: 16px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--label); }
.facts b { color: var(--ink); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; color: var(--label); font-weight: 600; padding: 3px 4px; border-bottom: 1px solid var(--line); }
td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.wchips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.wtable td:first-child { min-width: 8.5em; }
.wtable td.n { font-size: 12px; padding-inline: 3px; }
.box { border: 1px solid var(--line); border-radius: 4px; background: var(--raised); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.box h3 { font-size: 16px; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opt { display: flex; justify-content: space-between; gap: 8px; text-align: left; width: 100%; align-items: center; }
.opt small { color: var(--muted); }
.opt .why { color: var(--bad); font-size: 11.5px; }
.list { display: flex; flex-direction: column; gap: 5px; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.warn { color: var(--warn); font-size: 12.5px; margin: 0; }
.taskres { margin: 0; font-weight: 600; } .taskres.pass { color: var(--good); } .taskres.fail { color: var(--bad); }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); }
.pill.buff { border-color: var(--good); color: var(--good); }
.pill.debuff { border-color: var(--bad); color: var(--bad); }
.big { font-family: var(--font-mono); font-size: 34px; font-weight: 600; line-height: 1; }
.forecast { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.parts { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stats3 div { background: var(--panel); border-radius: 4px; padding: 4px 6px; }
.stats3 b { display: block; font-family: var(--font-mono); font-size: 15px; }
.facing { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.facing button { padding: 4px 0; font-size: 16px; }

.log { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; max-height: 340px; overflow-y: auto; }
.log-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.entry { padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.entry .when { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 6px; }
.die { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 3px; margin: 1px; border-radius: 3px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--raised); }
.die.hit { background: var(--good); color: var(--bg); border-color: var(--good); }
.die.crit { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.die.glance { border-color: var(--good); color: var(--good); }
.die.miss { color: var(--muted); }
.die.old { text-decoration: line-through; opacity: 0.6; }
.die.brace { border-color: var(--blue); color: var(--blue); }
.tok .bracebadge { fill: var(--ink); }
.checks .ok { color: var(--good); font-weight: 600; } .checks .fail { color: var(--bad); font-weight: 600; }
.banner { position: relative; margin: -12px -14px 0; }
.banner img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.banner span { position: absolute; left: 10px; bottom: 8px; background: var(--panel); color: var(--ink); font-size: 11px; padding: 2px 7px; border-radius: 3px; }
.role { display: inline-block; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--ink); color: var(--bg); }
.prov { color: var(--warn); font-size: 12px; margin: 0; }
.formgrid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.weaponpick { display: flex; flex-direction: column; gap: 3px; max-height: 200px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; padding: 6px; background: var(--raised); }
.weaponpick label { font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
/* GM screen: the cover panel between one side's hidden orders and the other's. */
.screencover { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.screencover .box { max-width: 440px; width: 100%; }
.screencover h2 { font-size: 28px; text-transform: uppercase; }
.screenbar { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; padding: 4px 10px; border-radius: 4px; background: var(--accent-soft); }
/* Terse card: resource strip, stat row, forecast grid, chips and kept-open details. */
.res { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12.5px; color: var(--label); align-items: center; }
.res b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.res span[title], .fc > div[title], b[title], h2[title] { cursor: help; }
.statrow b.up { color: var(--good); } .statrow b.down { color: var(--bad); }
.pill.warnpill { border-color: var(--warn); color: var(--warn); }
.fc { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.fc > div { background: var(--panel); border-radius: 4px; padding: 4px 6px; font-size: 12px; }
.fc > div.wide { grid-column: span 2; }
.fc b { font-family: var(--font-mono); font-size: 15px; }
.fc b.big { display: block; font-size: 28px; }
.fc .label { display: block; }
.opt.dim { opacity: 0.55; }
[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.opt .pill, .res .pill, td .pill { font-size: 10.5px; }
details { border: 1px solid var(--line); border-radius: 4px; background: var(--raised); }
details > summary { cursor: pointer; padding: 6px 10px; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; color: var(--label); }
details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
details .detbody { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
img.art { display: block; width: 100%; height: auto; border-radius: 3px; }
.dtab td.likely, .dtab th.likely { box-shadow: inset 0 0 0 1px var(--accent); }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.cols3 > div { background: var(--panel); border-radius: 4px; padding: 5px 6px; font-size: 12px; }
.cols3 b.big2 { display: block; font-family: var(--font-mono); font-size: 20px; }
.cols3 > div.likely { box-shadow: inset 0 0 0 1px var(--accent); }

/* Map layers */
.hex { stroke: var(--hex-line); stroke-width: 1; fill: var(--map); }
.hex.light { fill: var(--cover-1); }
.hex.heavy { fill: var(--cover-2); }
.hex.tall { fill: var(--cover-2); stroke: var(--cover-edge); stroke-width: 2.4; }
.hex.lowobs { fill: var(--obs-low); }
.hex.tallobs { fill: var(--obs-tall); }
.hex.wreck { fill: var(--wreck); }
/* Terrain texture: dots for cover (denser = more), hatching for obstacles, small crosses for wrecks. */
.tmark { fill: var(--terrain-mark); }
.tline { stroke: var(--terrain-mark); stroke-width: 1.1; fill: none; }
.hexpat { stroke: none; pointer-events: none; }
.hex.move { fill: var(--move-tint); stroke: var(--accent); stroke-width: 1.6; }
.hex.wrange { fill: var(--range-soft); stroke: var(--good); stroke-width: 1.4; pointer-events: none; }
.hex.wblocked { fill: none; stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 3 2; pointer-events: none; }
.hex.field { fill: none; stroke: var(--blue); stroke-dasharray: 2 3; stroke-width: 1; pointer-events: none; }
.hex.field.r { stroke: var(--red); }
.hexhit { fill: transparent; stroke: none; cursor: pointer; }
.coord { font-family: var(--font-mono); font-size: 7px; fill: var(--muted); opacity: 0.5; pointer-events: none; }
.tok text { font-family: var(--font-display); font-weight: 700; font-size: 10px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tok.b .cbase { fill: var(--blue-soft); } .tok.r .cbase { fill: var(--red-soft); }
.tok .cedge { fill: none; stroke-width: 2.5; }
.tok.b .cedge { stroke: var(--blue); } .tok.r .cedge { stroke: var(--red); }
.tok text.cbig { font-size: 9px; }
.tok .nose.b { fill: var(--blue); } .tok .nose.r { fill: var(--red); }
.tok .nose { stroke: var(--bg); stroke-width: 0.8; }
.tok .air, .tok .bracebadge { fill: var(--ink); stroke: var(--bg); stroke-width: 1.2; } .tok .airtxt { fill: var(--bg); font-size: 8px; }
.tok { cursor: pointer; }
/* Name plate under each counter, drawn above all counters so a neighbour never hides it; clicks pass through. */
.plate { pointer-events: none; }
.plate .pbg { stroke: var(--bg); stroke-width: 1; }
.plate.b .pbg { fill: var(--blue); } .plate.r .pbg { fill: var(--red); }
.plate text { font-family: var(--font-display); font-weight: 700; font-size: 9px; letter-spacing: 0.05em; fill: var(--bg); text-anchor: middle; dominant-baseline: central; }
.plate .hpbg { fill: var(--bg); } .plate .hp { fill: var(--good); } .plate .hp.low { fill: var(--warn); } .plate .hp.crit { fill: var(--bad); }
.selring { fill: none; stroke: var(--accent); stroke-width: 3; }
.tgtring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.tgtbadge { fill: var(--accent); stroke: var(--bg); stroke-width: 1.2; }
.tgttxt { fill: var(--bg); font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 4; pointer-events: none; }
.path.b { stroke: var(--blue); } .path.r { stroke: var(--red); }
.ghost { fill: none; stroke-width: 1.5; stroke-dasharray: 3 2; pointer-events: none; }
.ghost.b { stroke: var(--blue); } .ghost.r { stroke: var(--red); }
.engline { stroke: var(--bad); stroke-width: 3; pointer-events: none; }
.losline { stroke-width: 1.5; stroke-dasharray: 6 4; pointer-events: none; }
.losline.clear { stroke: var(--good); } .losline.blocked { stroke: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .tok { transition: transform 0.25s ease; } }
</style>

// The page's tables below are built from CATALOGUE. Page-only data stays here: the weapon sizes for the Add unit
// tab, frame lore, manoeuvre lists by movement type, art, pilots, squads, presets and terrain.
const ARC_DEG = { Narrow: 90, Front: 120, Half: 180, All: 360 };
const lc = s => String(s).toLowerCase().replace(/[ -]/g, '_');
// Weapons: shots × damage, armour piercing, aim, heavy, melee, range in hexes, arc, magazine, spares, Energy and Special
// are the sheet's. `size` is the sandbox's own carry rule for the Add unit tab (the sheet has no weapon size): a frame
// carries weapons of its size or smaller, plus its standard loadout. Weapons not listed here are medium.
const WEAPON_SIZE = {
  vb2_vibro_knife: 'small', coaxial_machine_gun: 'small', nose_autocannon: 'small', guided_missiles: 'small', m2_kit_atgm_tubes: 'small',
  rd9_rivet_driver: 'small', pt4_plasma_torch: 'small',
  gradm_rocket_battery: 'large', molot_hydraulic_ram: 'large', type09_long_cannon: 'large', '125mm_tank_gun': 'large', type01_shoulder_cannon: 'large',
  '2am_molot_autoloading_cannon': 'large', kalibr305_siege_mortar: 'large', iskra_particle_cannon: 'large',
};
// The sheet's one Hands row (tag hands_by_size) gives Medium frames 2 × 4; Large and super-heavy frames get 2 × 5 and
// Small frames 2 × 3, as its Special says. They are fitted automatically (`builtin`).
const HANDS_BY_SIZE = { small: ['hands_small', 3], large: ['hands_large', 5] };
const W = {};
for (const c of CATALOGUE.weapons) {
  const t = c.tags || {};
  const w = { name: c.name, type: lc(c.damage_type), shots: c.shots, dmg: c.damage, ap: c.ap, aim: c.aim, heavy: c.heavy, melee: c.melee,
    rmin: c.melee ? 0 : c.min_range, rmax: c.melee ? 0 : c.max_range, arc: ARC_DEG[c.arc], mag: c.magazine, spares: c.spares, energy: c.energy,
    size: WEAPON_SIZE[c.id] || 'medium', special: c.special || '', gen: c.gen, tags: t };
  if (t.kneel_only) Object.assign(w, { still: true, kneel: true });
  if (t.on_hit) w.onHit = t.on_hit;
  if (t.hands_by_size) {
    W[c.id] = Object.assign(w, { name: 'Hands', size: 'medium', special: '', builtin: true });
    for (const [size, [id, dmg]] of Object.entries(HANDS_BY_SIZE)) W[id] = Object.assign({}, w, { dmg, size });
  } else W[c.id] = w;
}

// Frames: Structure, Armour and type, Move (hexes), Energy, Recharge, hardware and thresholds for the six frame
// stats, and Brace [hardware, threshold], all from the sheet's Frames tab. Order of the six:
// Gunnery, Melee, Precision, Reflex, Systems, Countermeasures.
const SIX = ['gunnery', 'melee', 'precision', 'reflex', 'systems', 'countermeasures'];
const six = a => Object.fromEntries(SIX.map((s, i) => [s, a[i]]));
const sf = (name, gen, size, structure, armour, armourType, move, energy, recharge, hw, th, brace, extra) =>
  Object.assign({ name, gen, type: 'ground', size, structure, armour, armourType, move, energy, recharge, hw: six(hw), th: six(th), brace,

const PROTOS = {};

}

// ---------- Hex geometry: pointy-top axial [q, r]; facings 0..5 = NE, E, SE, SW, W, NW ----------
const SQ3 = Math.sqrt(3);
const COLS = 27, ROWS = 23, C0 = 13, R0 = 11;
const DIRS = [[1, -1], [1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1]];
const ARROWS = ['↗', '→', '↘', '↙', '←', '↖'];
const BANDS = ['GROUND', 'LOW', 'HIGH'];
const ARC_HEX = { 90: 60, 120: 120, 180: 180, 360: 360 };
const ARC_NAME = { 60: 'Narrow', 120: 'Front', 180: 'Half', 360: 'All' };
const key = h => h[0] + ',' + h[1];
const unkey = k => k.split(',').map(Number);
const parity = r => ((r % 2) + 2) % 2;
const fmod = f => ((f % 6) + 6) % 6;
const toAxial = (c, r) => [c - (r - parity(r)) / 2, r];
const toOffset = h => [h[0] + (h[1] - parity(h[1])) / 2, h[1]];
const inMap = h => { if (h[1] < 0 || h[1] >= ROWS) return false; const c = toOffset(h)[0]; return c >= 0 && c < COLS; };
const hdist = (a, b) => { const dq = a[0] - b[0], dr = a[1] - b[1]; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; };
const world = h => [h[0] + h[1] / 2, h[1] * SQ3 / 2];
const step = (h, f) => { const d = DIRS[fmod(f)]; return [h[0] + d[0], h[1] + d[1]]; };
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const clampT = v => clamp(v, 1, 9);
function compass(a, b) { const p = world(a), q = world(b); return (Math.atan2(q[0] - p[0], -(q[1] - p[1])) * 180 / Math.PI + 360) % 360; }
const facingAngle = f => 30 + 60 * fmod(f);
const angDiff = (x, y) => { const d = Math.abs(((x - y) % 360 + 540) % 360 - 180); return d; };
function inArc(u, h, gameArc) {
  if (same(u.hex, h)) return true;
  const arc = ARC_HEX[gameArc] || gameArc;
  if (arc >= 360) return true;
  return angDiff(compass(u.hex, h), facingAngle(u.facing)) <= arc / 2 + 1e-6;

function selected() { const u = S.sel && U(S.sel); return u && (alive(u) || S.gm) ? u : null; }

}
// The selected weapon's reach for a target on the GROUND: in range and arc, split by line of sight.

function counter(u, x, y, scale, tgLabel) {
  const r = CR, c = sideCls(u), a = (facingAngle(u.facing) - 90) * Math.PI / 180;

  g += `<title>${u.cs} · ${fr(u).name} · ${pl(u).role} · ${BANDS[u.band]} · Structure ${u.structure}</title>`;
  if (S.sel === u.id) g += `<polygon class="selring" points="${hexPoints(0, 0, r + 3.5)}"/>`;
  if (tgLabel !== undefined) g += `<polygon class="tgtring" points="${hexPoints(0, 0, r + 6)}"/>`;
  g += `<polygon class="nose ${c}" points="${nose}"/>`;

// The counter's name plate: callsign over a structure bar, across the counter's foot and just below it.

const tip = s => String(s ?? '').replace(/<[^>]+>/g, '').replace(/&(?![a-z#0-9]+;)/gi, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

const OPEN = new Set();
const det = (id, summary, body, title) => `<details data-keep="${id}"${OPEN.has(id) ? ' open' : ''}><summary${title ? ` title="${tip(title)}"` : ''}>${summary}</summary><div class="detbody">${body}</div></details>`;
// A button that cannot be used now: still focusable, with the reason as its tooltip (onClick ignores it).
const disTip = (why, desc) => why ? ` aria-disabled="true" title="${tip(desc ? `${why}. ${desc}` : why)}"` : desc ? ` title="${tip(desc)}"` : '';

const wStats = w => `${w.shots}×${w.dmg}${w.ap ? ` AP${w.ap}` : ''}`;
function ammoTxt(u, wid) { const w = W[wid], am = u.ammo[wid]; return [am ? `${am.mag}/${w.mag}+${am.spares}` : '', w.energy ? `${w.energy} En` : ''].filter(Boolean).join(' · ') || '—'; }

function weaponChips(u, wid, notes) {
  const w = W[wid], out = [];
  if (w.heavy) out.push(chip('heavy', 'Heavy: a miss by 1–2 is a glance'));
  if (w.kneel) out.push(chip('kneel', w.special));
  if (w.aim) out.push(chip(`aim ${w.aim > 0 ? '+' : '−'}${Math.abs(w.aim)}`, 'Aim: added to the hit target'));
  const mine = notes.filter(n => n.wid === wid);
  for (const n of mine) out.push(chip(n.s, w.special ? `${w.special}.` : n.t));
  if (!mine.length && w.special && !w.kneel && !(/^Powered/.test(w.special) && w.energy)) out.push(chip(shortSpecial(w.special), w.special));
  return out.join(' ');
}
const PRESET_GROUPS = [
  ['Gen 2', { contact: 'Contact (8 hexes)', skirmish: 'Skirmish' }],
  ['Gen 1', { gen1: 'All nine frames', g1_us_ep: 'US v Pact', g1_cu_ep: 'Union v Pact', g1_us_cu: 'US v Union' }],
  ['October loadouts', { oct_us_ep: 'Oct: US v Pact', oct_cu_ep: 'Oct: Union v Pact', oct_us_cu: 'Oct: US v Union' }],
];
function presetOptions(sel) {

    + (rest.length ? `<optgroup label="Other">${rest.map(k => opt(k, PRESETS[k].name)).join('')}</optgroup>` : '');
}

  ].join('');
  const stats = STATS.map(s => {
    const pil = pilotStat(u, s), eff = s === 'spirit' ? 0 : effectSum(u, s);
    const t = s === 'spirit' ? `Spirit ${pil} (max Will)` : `${STAT_NAME[s]}: pilot ${pil} + hardware ${hwOf(f, s)} + effects ${eff} = ${stat(u, s)}; threshold ${thOf(f, s)}`;

function stanceBox(u) {

  }).join('');

  else if (mustMove(u)) { const d = defaultOrder(u); cur = `<p class="warn">No order: will ${d ? MANO[d.m].name + (d.m === 'cruise' ? ' straight on' : '') : 'move straight on'}.</p>`; }

function actionBox(u) {

// The weapon picker (Attack and Declare): weapons with no legal target are dimmed, the reason in the tooltip.

    const brk = `${STAT_NAME[T.stat]} ${stat(u, T.stat)} ${DIFF[T.diff] >= 0 ? '+' : '−'} ${Math.abs(DIFF[T.diff])} (${T.diff})${T.push ? ' + 2 Push' : ''}${T.helper ? ' + 1 help' : ''}${raw !== t ? ` = ${raw}, limited to ${t}` : ''}`;
    fc = `<div class="row"><span class="label">Target</span><b class="big" title="${tip(brk)}">${t}</b><span class="parts">Success ${pct(t / 10)}</span></div>
      ${last ? `<p class="taskres ${last.pass ? 'pass' : 'fail'}">Rolled ${last.r} vs ${last.t}: ${last.pass ? 'success' : 'failure'}${last.fight ? ' · action used' : ''}</p>` : ''}${err && !(last && last.fight && err === 'Action already used') ? `<p class="warn">${err}.</p>` : ''}<div class="row"><button class="primary" data-aft="task" ${err ? 'disabled' : ''}>Roll task check</button></div>`;
  }
  return `<div class="box"><h3 title="d10 at or under stat + difficulty, +2 Push, +1 help from a same-side unit with 6+ in the stat; limited to 1–9">Task check</h3><div class="formgrid">
      <label for="tkunit">Unit</label><select id="tkunit"><option value="">—</option>${units.map(x => `<option value="${x.id}" ${T.unit === x.id ? 'selected' : ''}>${x.cs}</option>`).join('')}</select>
      <label for="tkstat">Stat</label><select id="tkstat">${STATS.map(s => `<option value="${s}" ${T.stat === s ? 'selected' : ''}>${STAT_NAME[s]}${u ? ` (${stat(u, s)})` : ''}</option>`).join('')}</select>
      <label for="tkdiff">Difficulty</label><select id="tkdiff">${Object.entries(DIFF).map(([k, v]) => `<option value="${k}" ${T.diff === k ? 'selected' : ''}>${k} (${v >= 0 ? '+' : '−'}${Math.abs(v)})</option>`).join('')}</select>
      <label for="tkhelp">Help</label><select id="tkhelp"><option value="">None</option>${helpers.map(h => `<option value="${h.id}" ${T.helper === h.id ? 'selected' : ''}>${h.cs} (${stat(h, T.stat)})</option>`).join('')}</select>
    </div>
    <div class="row"><label title="1 Will, +2"><input type="checkbox" id="tkpush" ${T.push ? 'checked' : ''} ${u && u.will < 1 ? 'disabled' : ''}> Push +2</label><label title="Uses the unit's action"><input type="checkbox" id="tkfight" ${T.fight ? 'checked' : ''}> In a fight</label></div>
    ${fc}</div>`;
}
function missionTabLabel() { const n = S.units.filter(u => u.eject && (u.eject.pending || u.eject.chooseStat)).length; return n ? `Aftermath (${n})` : 'Aftermath'; }
function missionBox() {
  const gone = S.units.filter(u => u.dead), out = S.units.filter(u => u.withdrawn), bench = S.bench || [];
  const nm = aftUi().nextMap || S.preset;
  return `<div class="box"><div class="row">
      <button data-aft="mission" class="${S.mission ? 'on' : ''}" aria-pressed="${!!S.mission}" title="Structure, Will, magazines, injuries and shaken status carry to the next fight">Mission mode${S.mission ? ` · fight ${S.fight || 1}` : ''}</button>
      <button data-aft="lethal" class="${S.lethal ? 'on' : ''}" aria-pressed="${!!S.lethal}" title="Lethal: an injury roll of 10 kills or captures the pilot; otherwise it is a lasting injury">Lethal fight</button></div></div>
    <div class="box"><h3>Destroyed</h3>${gone.length ? gone.map(u => `<div><b><span class="dot ${sideCls(u)}"></span> ${u.cs}</b> <span class="note">${fr(u).name}</span>${aftermathNote(u)}</div>`).join('') : '<p class="note">None.</p>'}</div>
    <div class="box"><h3>Withdrawn</h3>${out.length ? `<div class="tablewrap"><table><tbody>${out.map(u => `<tr><td><span class="dot ${sideCls(u)}"></span> ${u.cs}</td><td>${fr(u).name}</td><td class="n">Str <b>${u.structure}/${fr(u).structure}</b></td></tr>`).join('')}</tbody></table></div>` : '<p class="note">None.</p>'}</div>
    ${taskBox()}
    ${S.mission ? `<div class="box"><h3>Between fights</h3>
      <div class="row"><button data-aft="downtime"${disTip(S.downtimeDone ? 'Taken' : '', `Field repair up to ${FIELD_REPAIR} Structure a frame, Will to Spirit less penalties, magazines and spares restocked`)}>Downtime</button></div>
      ${bench.length ? `<p class="note" title="They return for the fight after next">Sitting out: ${bench.map(u => u.cs).join(', ')}.</p>` : ''}
      <div class="row"><label>Next map <select id="nextmap">${presetOptions(nm)}</select></label><button class="primary" data-aft="nextfight" title="A destroyed mech's surviving pilot returns in a replacement frame of the same type">Start next fight</button></div></div>` : ''}`;
}
function aftUi() {
  if (!S.aftUi) S.aftUi = {};
  if (!S.aftUi.task) S.aftUi.task = { unit: '', stat: 'gunnery', diff: 'Standard', push: false, helper: '', fight: true };
  return S.aftUi;
}
function aftermathClick(d, u) {
  const A = aftUi(), T = A.task, X = d.uid && U(d.uid);
  let err = '';
  switch (d.aft) {
    case 'withdraw': err = u ? withdraw(u) : 'No unit selected'; if (err) log(`${u ? u.cs : 'Withdraw'}: cannot withdraw: ${err}.`); break;
    case 'tasktab': if (u) { T.unit = u.id; T.helper = ''; } S.tab = 'mission'; break;
    case 'task': { const t = U(T.unit), res = taskCheck(t, T.stat, T); if (res.err) log(`Task check: ${res.err}.`); else T.last = { unit: t.id, round: S.round, r: res.r, t: res.t, pass: res.pass, fight: !!T.fight }; T.push = false; break; }
    case 'eject': if (X) { const res = rollEjection(X, d.push === '1'); if (res.err) log(`${X.cs}: ${res.err}.`); } break;
    case 'lasting': if (X) { err = applyLasting(X, d.stat); if (err) log(`${X.cs}: ${err}.`); } break;
    case 'mission': S.mission = !S.mission; if (S.mission && !S.fight) S.fight = 1; log(`Mission mode ${S.mission ? 'on' : 'off'}.`); break;
    case 'lethal': S.lethal = !S.lethal; log(`This fight is ${S.lethal ? '' : 'not '}lethal.`); break;
    case 'downtime': err = downtime(); if (err) log(err + '.'); break;
    case 'nextfight': err = nextFight(A.nextMap || S.preset); if (err) log(`Cannot start the next fight: ${err}.`); else S.aftUi = { nextMap: S.preset }; break;
  }
}
function aftermathChange(t) {
  const A = aftUi(), T = A.task;
  if (t.id === 'preset' && S.mission) { const err = nextFight(t.value); if (err) log(`Cannot start the next fight: ${err}.`); return true; }
  if (t.id === 'tkunit') { T.unit = t.value; T.helper = ''; }
  else if (t.id === 'tkstat') { T.stat = t.value; T.helper = ''; }
  else if (t.id === 'tkdiff') T.diff = t.value;
  else if (t.id === 'tkhelp') T.helper = t.value;
  else if (t.id === 'tkpush') T.push = t.checked;
  else if (t.id === 'tkfight') T.fight = t.checked;
  else if (t.id === 'nextmap') A.nextMap = t.value;
  else return false;
  return true;
}

function renderSide() {
  aftUi();
  const tabs = [['unit', 'Unit'], ['add', 'Add unit'], ['mission', missionTabLabel()], ['checks', 'Checks', 'Rules checks']];
  let body = '';
  if (S.tab === 'unit') {
    const u = selected();
    if (!u) body = `<p class="note">Select a unit on the map or in the initiative bar.</p>
      ${det('howto', 'How a round runs', `<p class="note"><b>Plan &amp; move:</b> a stance and a manoeuvre per unit; moves resolve in initiative order.<br><b>Action:</b> one Protocol, reload or break-off each.<br><b>Attack:</b> in initiative order: weapon, target, roll.<br><b>End:</b> Energy recharges, effects count down.</p>`)}${rosterBox()}`;
    else {
      // Header, resources and chips; the phase box; the weapon table (the picker replaces it in Attack and Declare);
      // then the closed Unit details.
      const sn = specialNotes(u);
      const phase = alive(u) ? screenBox(u, sn) || (S.phase === 'plan' ? planBox(u) : S.phase === 'action' ? actionBox(u) : attackBox(u, sn)) : '';
      const table = weaponTable(u, sn), inPhase = S.phase === 'plan' || S.phase === 'action';
      body = unitTop(u, sn) + phase + (inPhase ? table : '') + unitDetails(u, inPhase ? '' : table);
      if (S.gm) body += gmBox(u);
    }
  } else if (S.tab === 'add') body = addBox();
  else if (S.tab === 'mission') body = missionBox();
  else body = checksBox();
  $('side').innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k, n, t]) => `<button role="tab" class="${S.tab === k ? 'on' : ''}" aria-selected="${S.tab === k}" data-tab="${k}"${t ? ` title="${t}"` : ''}>${n}</button>`).join('')}</div><div class="pane">${body}</div>`;
}
function render() { renderHeader(); renderInit(); renderMap(); renderSide(); renderLog(); renderCover(); }

// ---------- Interaction ----------
function selectUnit(id) { S.sel = id; S.ui = {}; S.placing = null; S.tab = 'unit'; }
function onMapClick(e) {
  const tok = e.target.closest('[data-u]'), hexEl = e.target.closest('[data-k]');
  const u = selected();
  if (tok) {
    const id = tok.getAttribute('data-u');
    const isTarget = targetsForUI().some(t => t.u.id === id);
    if (u && isTarget) {
      if (S.phase === 'plan' && S.ui.m === 'charge') { u.order = { m: 'charge', target: id, cost: 1 }; }
      else S.ui.target = id;
      render(); return;
    }
    if (!(S.placing && hexEl)) { selectUnit(id); render(); return; }
  }
  if (!hexEl) return;
  const h = unkey(hexEl.getAttribute('data-k'));
  if (S.placing === 'teleport' && u) {
    if (blocks(terrainAt(h), u.band) || unitAt(h, u.band, u)) { log(`GM: ${u.cs} cannot stand in that hex at ${BANDS[u.band]}.`); }
    else { u.hex = h; u.order = null; cleanEngagements(); log(`GM: ${u.cs} moved to ${toOffset(h).join(',')}.`); }
    S.placing = null; render(); return;
  }
  if (S.placing === 'add') {
    const a = S.ui.add, f = F[a.frame], band = f.bands[0];
    if (blocks(terrainAt(h), band) || unitAt(h, band)) { log('That hex is blocked or occupied.'); render(); return; }
    let id = (a.cs || 'UNIT').toLowerCase().replace(/[^a-z0-9]/g, '') || 'unit'; while (U(id)) id += 'x';
    S.units.push(makeUnit({ id, cs: (a.cs || 'UNIT').toUpperCase(), side: Number(a.side), pilot: a.pilot, frame: a.frame, faction: f.gen === 1 ? a.faction : null, weapons: a.weapons, hex: h, facing: Number(a.side) === 0 ? 1 : 4, band, protos: [] }));
    S.tiebreak[id] = Math.random();
    log(`Added <b>${(a.cs || 'UNIT').toUpperCase()}</b> (${f.gen === 1 && FACTION[a.faction] ? FACTION[a.faction].name + ' ' : ''}${f.name}, ${P[a.pilot].name}).`);
    S.placing = null; selectUnit(id); render(); return;
  }
  if (u && S.phase === 'attack' && u.scoot && doScoot(u, h)) { render(); return; }
  const ends = currentEnds();
  if (u && ends && ends.has(key(h))) {
    const list = ends.get(key(h));
    const opt = list.find(o => o.facing === u.facing) || list[0];
    setOrder(u, opt.m || S.ui.m, S.ui.m ? (S.ui.band ?? u.band) : u.band, opt);
    render(); return;
  }
  if (!tok) { const here = living().filter(x => same(x.hex, h)); if (here.length) { selectUnit(here[here.length - 1].id); render(); } }
}
function onClick(e) {
  const b = e.target.closest('button'); if (!b || b.disabled || (b.getAttribute && b.getAttribute('aria-disabled') === 'true')) return;
  const u = selected(), d = b.dataset;
  if (d.aft) { aftermathClick(d, u); render(); return; }
  if (d.scr) { screenClick(d, u); render(); return; }
  if (d.tab) { S.tab = d.tab; S.placing = null; }
  else if (d.sel) selectUnit(d.sel);
  else if (d.stance) {
    u.stance = d.stance;
    if (bracing(u) && u.order && (u.order.m === 'charge' || (u.order.path && u.order.path.length - 1 > moveCap(u)) || manoError(u, u.order.m))) { if (!S.screen) log(`${u.cs} braces: its ${MANO[u.order.m].name} order is over the Brace limit and is cleared.`); u.order = null; }
    S.ui = {};
  }
  else if (d.mano) { if (S.ui.m === d.mano) S.ui = {}; else { S.ui = { m: d.mano, band: u.band }; if (u.order && u.order.m !== d.mano) u.order = null; } }
  else if (d.band !== undefined) { S.ui.band = Number(d.band); if (u.order) u.order = null; }
  else if (d.face !== undefined) { const ends = currentEnds(), k = key(u.order.path[u.order.path.length - 1]); const opt = ends.get(k).find(o => o.facing === Number(d.face)); if (opt) setOrder(u, opt.m || S.ui.m, S.ui.m ? (S.ui.band ?? u.band) : u.band, opt); }
  else if (d.weapon) { S.ui = { w: d.weapon, push: false, see: false }; }
  else if (d.proto) { S.ui = { p: d.proto }; if (PROTOS[d.proto].self) S.ui.target = u.id; }
  else if (d.eff !== undefined) S.ui.eff = Number(d.eff);
  else if (d.reload) { const a = u.ammo[d.reload]; a.spares--; a.mag = W[d.reload].mag; u.acted = true; log(`${u.cs} reloads ${W[d.reload].name} (${a.spares} spare left).`); }
  else if (d.newtype) { u.will--; u.newtypeUsed = true; u.facing = fmod(u.facing + Number(d.newtype)); log(`${u.cs} uses Newtype Reflexes: turns to ${ARROWS[u.facing]} (1 Will).`); }
  else if (d.gm) gmAction(u, d.gm);
  else if (d.special) specialAction(u, d.special);
  else if (d.gmband !== undefined) { const nb = Number(d.gmband); if (unitAt(u.hex, nb, u)) log(`GM: that band is occupied in this hex.`); else { u.band = nb; cleanEngagements(); } }
  else if (d.act) {
    switch (d.act) {
      case 'advance': advance(); return;
      case 'reset': newState(S.preset); break;
      case 'allprotos': S.allProtos = !S.allProtos; S.ui = {}; break;
      case 'gm': S.gm = !S.gm; S.placing = null; break;
      case 'clearorder': u.order = null; break;
      case 'fire': {
        const t = U(S.ui.target), res = fireOnTurn(u, t, S.ui.w, { push: S.ui.push, seeIt: S.ui.see });
        if (res.err) log(`${u.cs} cannot attack: ${res.err}.`); else attackLog(u, t, res);
        S.ui = {}; break;
      }
      case 'useproto': {
        const t = U(S.ui.target), res = useProtocol(u, S.ui.p, t, S.ui.ppush, S.ui.eff || 0);
        if (res.err) log(`${u.cs} cannot use ${PROTOS[S.ui.p].name}: ${res.err}.`);
        S.ui = {}; break;
      }
      case 'breakoff': { const err = breakOff(u); if (err) log(`${u.cs} cannot break off: ${err}.`); break; }
      case 'place': S.placing = 'add'; break;
    }
  }
  render();
}
function gmAction(u, a) {
  if (a === 'left') u.facing = fmod(u.facing - 1);
  else if (a === 'right') u.facing = fmod(u.facing + 1);
  else if (a === 'teleport') S.placing = S.placing === 'teleport' ? null : 'teleport';
  else if (a === 's-10') { if (applyDamage(u, 10)) log(`GM: ${u.cs} is destroyed.`); }
  else if (a === 's+10') { u.structure = Math.min(fr(u).structure, u.structure + 10); }
  else if (a === 'e+1') u.energy = Math.min(fr(u).energy, u.energy + 1);
  else if (a === 'w+1') u.will = Math.min(pl(u).stats.spirit, u.will + 1);
  else if (a === 'clearfx') u.effects = [];
  else if (a === 'refit') { for (const w of Object.keys(u.ammo)) u.ammo[w] = { mag: W[w].mag, spares: fr(u).noSpares ? 0 : W[w].spares }; addExtraSpares(fr(u), u.weapons, u.ammo); }
  else if (a === 'remove') { S.units = S.units.filter(x => x !== u); for (const o of S.units) o.engaged = o.engaged.filter(id => id !== u.id); S.sel = null; }
}
function onChange(e) {
  const t = e.target, u = selected();
  if (aftermathChange(t)) { render(); return; }
  if (t.id === 'preset') { newState(t.value); }
  else if (t.id === 'push') S.ui.push = t.checked;
  else if (t.id === 'see') S.ui.see = t.checked;
  else if (t.id === 'ppush') S.ui.ppush = t.checked;
  else if (t.id === 'augmented' && u) u.augmented = t.checked;
  else if (t.id === 'gmpilot' && u) { u.pilot = t.value; u.will = Math.min(u.will, pl(u).stats.spirit); }
  else if (t.id === 'addcs') { S.ui.add.cs = t.value; return; }
  else if (t.id === 'addside') S.ui.add.side = Number(t.value);
  else if (t.id === 'addframe') { const [k, fa] = t.value.split('@'); S.ui.add.frame = k; S.ui.add.faction = fa || null; S.ui.add.weapons = (F[k].loadout || []).slice(); }
  else if (t.id === 'addpilot') S.ui.add.pilot = t.value;
  else if (t.dataset.addw) { const w = t.dataset.addw, list = S.ui.add.weapons; if (t.checked && !list.includes(w)) list.push(w); if (!t.checked) S.ui.add.weapons = list.filter(x => x !== w); }
  render();
}

function start(data) {
  const fits = s => s && s.ver === 3 && s.units && s.units.every(u => P[u.pilot] && F[u.frame] && u.weapons.every(w => W[w]));
  if (data && fits(data.S)) { S = data.S; } else newState('gen1');
  window.claude?.hot?.snapshot?.(() => ({ S }));
  document.addEventListener('click', e => { if (e.target.closest('#map')) onMapClick(e); else onClick(e); });
  document.addEventListener('change', onChange);
  window.addEventListener('resize', () => renderMap());
  // Keep each <details> open or closed across re-renders.
  document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.keep; if (k) { if (e.target.open) OPEN.add(k); else OPEN.delete(k); } }, true);
  render();
}
if (typeof document !== 'undefined') {
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
</script>
